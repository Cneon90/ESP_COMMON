; File: platformio.ini
; Esp_common: esp32dev (прошивка, Arduino-ESP32) + native (Unity-тесты без железа).
; Точка входа — main.cpp в корне, поэтому src_dir = "." и фильтры источников явные.

[platformio]
src_dir = .
default_envs = esp32dev

[env]
monitor_speed = 115200

; ---------------------------------------------------------------------
; Прошивка ESP32 (Arduino framework, mbedTLS из состава core).
; ---------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
build_src_filter = +<src/*> +<main.cpp>

; ---------------------------------------------------------------------
; Юнит-тесты на хосте (Unity). mbedTLS — из реестра PlatformIO.
; Нативно собирается только src/ (без main.cpp и Arduino-транспорта).
; ---------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Iinclude
    -lbcrypt
lib_deps = kochcodes/mbedtls@^3.6.2
build_src_flags = -Werror
build_src_filter = +<src/*>

; ---------------------------------------------------------------------
; Лёгкий профиль: только UART/RS485, без WiFi/lwip/TCP (-ESP_COMMON_NO_TCP).
; Для проектов с запасом по flash также можно раскомментировать
; board_build.partitions = huge_app.csv (приложение 3 МБ вместо 1.2 МБ).
; ---------------------------------------------------------------------
[env:esp32dev_serial]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D ESP_COMMON_NO_TCP
